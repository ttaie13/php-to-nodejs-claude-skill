name: Validate skill
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/php_inventory.py
      - run: python scripts/php_inventory.py . --output /tmp/migration-inventory.json
